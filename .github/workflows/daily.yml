name: daily-pipeline

# Runs the GitHub API pull + `dbt run` on a schedule.
# See docs/PROJECT_LOG.md Phase-4 entry for why 06:00 UTC, why a
# separate service account, and how the sandbox quota interacts
# with a scheduled job.

on:
  schedule:
    # 06:00 UTC daily = 08:00 CEST / 09:00 EEST — off-peak globally,
    # avoids the top-of-hour and 00:00 UTC cron slots that share
    # runners with the busiest scheduled workloads on GitHub.
    - cron: '0 6 * * *'
  workflow_dispatch: {}  # manual trigger for testing / catch-up

concurrency:
  # Prevents overlapping runs if a scheduled run drifts long enough
  # that the next one is queued before it finishes. `cancel-in-progress: false`
  # → queue the second, don't kill the first (we prefer both to complete
  # rather than lose a data point).
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: read       # workflow needs to check out but never push

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --only-binary=:all: \
            dbt-bigquery \
            google-cloud-bigquery

      - name: Authenticate to GCP
        # Writes the SA keyfile to a temp path and exports
        # GOOGLE_APPLICATION_CREDENTIALS for downstream steps.
        # dbt/profiles.yml reads the same env var.
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Pull GitHub metrics
        # GITHUB_TOKEN is a workflow-scoped token GitHub provides
        # automatically; using it bumps the API rate limit from 60
        # (anon) to 5000 requests/hour — plenty for 3 repos daily.
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python python/github_metrics_pull.py

      - name: dbt run
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: dbt run
