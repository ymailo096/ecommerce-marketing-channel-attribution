version: 2

sources:
  - name: olist_raw
    description: >
      Raw Olist tables loaded via `bq load` from Kaggle CSVs, plus the
      synthetic ad_spend table generated by Python stdlib. This is the
      only place downstream models read from — nothing else touches
      olist_raw directly.
    database: ecommerce-channel-attribution
    schema: olist_raw

    tables:
      - name: customers
        description: 1 row per customer_id (Olist's per-order customer id).
      - name: orders
        description: 1 row per order.
      - name: order_items
        description: 1 row per (order_id, order_item_id) — line item within an order.
      - name: order_payments
        description: 1 row per (order_id, payment_sequential) — payment installment.
      - name: ad_spend
        description: >
          1 row per (channel, month) — synthetic, seeded. Deliberately
          coarser than orders; downstream metrics must aggregate to
          (channel, month) grain BEFORE joining to this.
      - name: github_metrics
        description: >
          1 row per (fetched_at, repo) — appended daily by the
          .github/workflows/daily.yml cron via python/github_metrics_pull.py.
          The "genuinely live" data source per docs/PROJECT_BRIEF.md §3.2 —
          proves the pipeline runs on a real schedule.
